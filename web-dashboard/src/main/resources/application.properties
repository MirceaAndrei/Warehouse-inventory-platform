server.port=8081
spring.application.name=inventory-dashboard

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Backend API URL
inventory.api.url=http://localhost:8082/api

# Logging
logging.level.com.inventory.dashboard=DEBUG
