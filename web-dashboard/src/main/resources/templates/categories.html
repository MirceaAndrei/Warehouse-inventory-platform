<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
<div th:replace="fragments/header :: navbar"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fas fa-tags me-2"></i>Category Management</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addCategoryModal">
                <i class="fas fa-plus me-2"></i>Add New Category
            </button>
        </div>

        <div id="alert-container"></div>

        <!-- Statistics Cards -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card bg-primary text-white">
                    <div class="card-body">
                        <h5 class="card-title"><i class="fas fa-tags me-2"></i>Total Categories</h5>
                        <h2 id="totalCategories">-</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-info text-white">
                    <div class="card-body">
                        <h5 class="card-title"><i class="fas fa-shield-alt me-2"></i>System Categories</h5>
                        <h2 id="systemCategories">-</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-success text-white">
                    <div class="card-body">
                        <h5 class="card-title"><i class="fas fa-user-edit me-2"></i>Custom Categories</h5>
                        <h2 id="customCategories">-</h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Description</th>
                                <th>Type</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="categoriesTable">
                            <tr>
                                <td colspan="5" class="text-center">
                                    <i class="fas fa-spinner fa-spin me-2"></i>Loading categories...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Category Modal -->
    <div class="modal fade" id="addCategoryModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-plus me-2"></i>Add New Category</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addCategoryForm">
                        <div class="mb-3">
                            <label class="form-label">Category Name *</label>
                            <input type="text" class="form-control" id="add_name" placeholder="e.g., Hardware" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="add_description" rows="3" placeholder="Brief description of this category"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="addCategory()">
                        <i class="fas fa-save me-2"></i>Create Category
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Category Modal -->
    <div class="modal fade" id="editCategoryModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-edit me-2"></i>Edit Category</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editCategoryForm">
                        <input type="hidden" id="edit_id">
                        <div class="mb-3">
                            <label class="form-label">Category Name *</label>
                            <input type="text" class="form-control" id="edit_name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="edit_description" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="updateCategory()">
                        <i class="fas fa-save me-2"></i>Save Changes
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title"><i class="fas fa-exclamation-triangle me-2"></i>Confirm Delete</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to delete category: <strong id="delete_category_name"></strong>?</p>
                    <p class="text-danger"><i class="fas fa-exclamation-circle me-2"></i>This action cannot be undone!</p>
                    <input type="hidden" id="delete_category_id">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" onclick="confirmDelete()">
                        <i class="fas fa-trash me-2"></i>Delete Category
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/dark-mode.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        const API_BASE = 'http://localhost:8082/api';
        let jwtToken = sessionStorage.getItem('token');
        let userRole = sessionStorage.getItem('role');
        const addModal = new bootstrap.Modal(document.getElementById('addCategoryModal'));
        const editModal = new bootstrap.Modal(document.getElementById('editCategoryModal'));
        const deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));

        // Check authentication
        if (!jwtToken) {
            window.location.href = '/login';
        }

        // Display username in header dropdown
        const username = sessionStorage.getItem('username');
        if (username) {
            const info = document.getElementById('username-info');
            if (info) info.textContent = username;
        }

        // Load categories on page load
        window.addEventListener('DOMContentLoaded', loadCategories);

        async function loadCategories() {
            try {
                const response = await fetch(`${API_BASE}/categories`, {
                    headers: {
                        'Authorization': `Bearer ${jwtToken}`
                    }
                });

                if (response.status === 403) {
                    showAlert('Access Denied', 'Only administrators can access this page.', 'danger');
                    setTimeout(() => window.location.href = '/inventory', 2000);
                    return;
                }

                if (!response.ok) {
                    throw new Error('Failed to load categories');
                }

                const categories = await response.json();
                displayCategories(categories);
                updateStatistics(categories);
            } catch (error) {
                console.error('Error loading categories:', error);
                showAlert('Error', 'Failed to load categories: ' + error.message, 'danger');
            }
        }

        function displayCategories(categories) {
            const tableBody = document.getElementById('categoriesTable');
            
            if (categories.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="5" class="text-center text-muted">
                            <i class="fas fa-inbox me-2"></i>No categories found
                        </td>
                    </tr>
                `;
                return;
            }

            tableBody.innerHTML = categories.map(cat => `
                <tr>
                    <td>${cat.id}</td>
                    <td><i class="fas fa-tag me-2 text-primary"></i><strong>${cat.name}</strong></td>
                    <td>${cat.description || '<span class="text-muted">No description</span>'}</td>
                    <td>
                        ${cat.isSystemDefault 
                            ? '<span class="badge bg-info"><i class="fas fa-shield-alt me-1"></i>System</span>' 
                            : '<span class="badge bg-success"><i class="fas fa-user me-1"></i>Custom</span>'}
                    </td>
                    <td>
                        <button class="btn btn-sm btn-primary" onclick="openEditModal(${cat.id}, '${cat.name.replace(/'/g, "\\'")}', '${(cat.description || '').replace(/'/g, "\\'")}')">
                            <i class="fas fa-edit"></i>
                        </button>
                        ${!cat.isSystemDefault 
                            ? `<button class="btn btn-sm btn-danger" onclick="openDeleteModal(${cat.id}, '${cat.name.replace(/'/g, "\\'")}')">
                                   <i class="fas fa-trash"></i>
                               </button>` 
                            : '<button class="btn btn-sm btn-secondary" disabled title="System categories cannot be deleted"><i class="fas fa-lock"></i></button>'}
                    </td>
                </tr>
            `).join('');
        }

        function updateStatistics(categories) {
            const total = categories.length;
            const system = categories.filter(c => c.isSystemDefault).length;
            const custom = total - system;

            document.getElementById('totalCategories').textContent = total;
            document.getElementById('systemCategories').textContent = system;
            document.getElementById('customCategories').textContent = custom;
        }

        async function addCategory() {
            const name = document.getElementById('add_name').value.trim();
            const description = document.getElementById('add_description').value.trim();

            if (!name) {
                showAlert('Validation Error', 'Category name is required.', 'warning');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/categories`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${jwtToken}`
                    },
                    body: JSON.stringify({
                        name: name,
                        description: description,
                        isSystemDefault: false
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to create category');
                }

                showAlert('Success', `Category "${name}" created successfully!`, 'success');
                addModal.hide();
                document.getElementById('addCategoryForm').reset();
                loadCategories();
            } catch (error) {
                console.error('Error creating category:', error);
                showAlert('Error', error.message, 'danger');
            }
        }

        function openEditModal(id, name, description) {
            document.getElementById('edit_id').value = id;
            document.getElementById('edit_name').value = name;
            document.getElementById('edit_description').value = description;
            editModal.show();
        }

        async function updateCategory() {
            const id = document.getElementById('edit_id').value;
            const name = document.getElementById('edit_name').value.trim();
            const description = document.getElementById('edit_description').value.trim();

            if (!name) {
                showAlert('Validation Error', 'Category name is required.', 'warning');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/categories/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${jwtToken}`
                    },
                    body: JSON.stringify({
                        name: name,
                        description: description
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to update category');
                }

                showAlert('Success', `Category "${name}" updated successfully!`, 'success');
                editModal.hide();
                loadCategories();
            } catch (error) {
                console.error('Error updating category:', error);
                showAlert('Error', error.message, 'danger');
            }
        }

        function openDeleteModal(id, name) {
            document.getElementById('delete_category_id').value = id;
            document.getElementById('delete_category_name').textContent = name;
            deleteModal.show();
        }

        async function confirmDelete() {
            const id = document.getElementById('delete_category_id').value;
            const name = document.getElementById('delete_category_name').textContent;

            try {
                const response = await fetch(`${API_BASE}/categories/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${jwtToken}`
                    }
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to delete category');
                }

                showAlert('Success', `Category "${name}" deleted successfully!`, 'success');
                deleteModal.hide();
                loadCategories();
            } catch (error) {
                console.error('Error deleting category:', error);
                showAlert('Error', error.message, 'danger');
            }
        }

        function showAlert(title, message, type) {
            const alertContainer = document.getElementById('alert-container');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type} alert-dismissible fade show`;
            alert.innerHTML = `
                <strong>${title}:</strong> ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            alertContainer.appendChild(alert);
            
            setTimeout(() => alert.remove(), 5000);
        }

        function logout() {
            sessionStorage.clear();
            window.location.href = '/login';
        }
    </script>
    <script>
        (function setActiveNav(){
            try {
                const path = window.location.pathname;
                document.querySelectorAll('.navbar-nav .nav-link').forEach(a => {
                    if (a.getAttribute('href') === path) a.classList.add('active'); else a.classList.remove('active');
                });
            } catch(e){/* ignore */}
        })();
    </script>
</body>
</html>
