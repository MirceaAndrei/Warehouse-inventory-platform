<!DOCTYPE html>
<div xmlns:th="http://www.thymeleaf.org" th:fragment="navbar">
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-warehouse"></i> Inventory System
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto align-items-lg-center">
                    <li class="nav-item">
                        <a class="nav-link" href="/inventory">
                            <i class="fas fa-boxes me-1"></i> Inventory
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/transactions">
                            <i class="fas fa-exchange-alt me-1"></i> Transactions
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/items">
                            <i class="fas fa-cogs me-1"></i> Item Management
                        </a>
                    </li>
                    <li class="nav-item manager-admin-only" style="display:none;">
                        <a class="nav-link" href="/categories">
                            <i class="fas fa-tags me-1"></i> Categories
                        </a>
                    </li>
                    <li class="nav-item admin-only" style="display:none;">
                        <a class="nav-link" href="/users">
                            <i class="fas fa-users-cog me-1"></i> Users
                        </a>
                    </li>
                    <li class="nav-item admin-only" style="display:none;">
                        <a class="nav-link" href="/database">
                            <i class="fas fa-database me-1"></i> Database
                        </a>
                    </li>
                </ul>

                <ul class="navbar-nav align-items-lg-center gap-1">
                    <!-- Dark mode toggle -->
                    <li class="nav-item me-1">
                        <button id="darkModeToggle" class="btn btn-link nav-link" title="Toggle dark mode (Ctrl+Shift+D)">
                            <i id="darkModeIcon" class="fas fa-moon"></i>
                        </button>
                    </li>

                    <!-- User dropdown -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle d-flex align-items-center gap-2" href="#"
                           id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-user-circle"></i>
                            <span id="navUsername">Account</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                            <li>
                                <span class="dropdown-item-text small px-3 py-1" id="navUserRole"
                                      style="color: rgba(232,234,246,0.5); font-size: 0.75rem; letter-spacing:0.5px;">
                                </span>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <a class="dropdown-item" href="/profile">
                                    <i class="fas fa-key me-2"></i> Change Password
                                </a>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <a class="dropdown-item text-danger" href="#" onclick="showLogoutModal()">
                                    <i class="fas fa-sign-out-alt me-2"></i> Logout
                                </a>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Logout Confirmation Modal -->
    <div class="modal fade" id="logoutModal" tabindex="-1" aria-labelledby="logoutModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="logoutModalLabel">
                        <i class="fas fa-sign-out-alt me-2"></i>Confirm Logout
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-0 text-muted">Are you sure you want to logout?</p>
                </div>
                <div class="modal-footer gap-2">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">
                        Cancel
                    </button>
                    <button type="button" class="btn btn-danger btn-sm" onclick="confirmLogout()">
                        <i class="fas fa-sign-out-alt me-1"></i>Logout
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Set active nav link and display username/role in navbar
        document.addEventListener('DOMContentLoaded', function() {
            try {
                // Highlight active nav link
                const path = window.location.pathname;
                document.querySelectorAll('.navbar-nav .nav-link[href]').forEach(a => {
                    const href = a.getAttribute('href');
                    if (href && href !== '#' && path === href) {
                        a.classList.add('active');
                    }
                });

                // Display username and role
                const username = sessionStorage.getItem('username');
                const role     = sessionStorage.getItem('role');
                const usernameEl = document.getElementById('navUsername');
                const roleEl     = document.getElementById('navUserRole');
                if (username && usernameEl) usernameEl.textContent = username;
                if (role && roleEl) roleEl.textContent = role;
            } catch (e) { /* ignore */ }
        });
        // showLogoutModal and confirmLogout are defined in auth.js
    </script>
</div>
