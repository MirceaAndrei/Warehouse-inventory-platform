# Server Configuration
server.port=8082
server.address=0.0.0.0
spring.application.name=inventory-backend

# H2 Database Configuration - FILE-BASED (Persistent)
spring.datasource.url=jdbc:h2:file:./data/inventorydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (DOAR pentru development! DEZACTIVEAZĂ în producție!)
# Acces restricționat la ADMIN prin SecurityConfig
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# CORS Configuration (for web and mobile access)
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Logging
logging.level.com.inventory.system=DEBUG
logging.level.org.springframework.web=INFO
